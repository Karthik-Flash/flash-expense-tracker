# Render Blueprint for the backend. When creating the Blueprint in the Render
# dashboard, set "Blueprint Path" to infra/render.yaml. See infra/README.md.
services:
  - type: web
    name: flash-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.12
      # Set these in the dashboard; sync: false keeps values out of git.
      - key: CORS_ORIGINS
        sync: false
      - key: DATABASE_URL
        sync: false
