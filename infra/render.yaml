# Render Blueprint for the backend. Optional: infra/README.md describes the
# same service as manual dashboard clicks. Keep both in sync.
# To use it: Render > New > Blueprint, Blueprint Path = infra/render.yaml.
services:
  - type: web
    name: flash-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    # Free plan has no pre-deploy command. Migrating in the build means a
    # failed migration fails the deploy and the previous version keeps serving.
    buildCommand: pip install -r requirements.txt && alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.12
      # Set these in the dashboard; sync: false keeps values out of git.
      - key: DATABASE_URL
        sync: false
      - key: PING_TOKEN
        sync: false
      - key: CORS_ORIGINS
        sync: false
