name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r backend/requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - name: pytest (backend)
        working-directory: backend
        run: python -m pytest -q
      - name: pytest (scripts)
        run: python -m pytest -q scripts

  backend-postgres:
    name: Backend on Postgres 17 (migrations + pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          # Disposable CI container; not a real credential.
          POSTGRES_USER: flash
          POSTGRES_PASSWORD: flash-ci
          POSTGRES_DB: flash_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U flash -d flash_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://flash:flash-ci@localhost:5432/flash_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r backend/requirements-dev.txt
      - name: alembic upgrade head + check
        working-directory: backend
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: |
          alembic upgrade head
          alembic check
      - name: pytest (backend, Postgres)
        working-directory: backend
        run: python -m pytest -q

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
