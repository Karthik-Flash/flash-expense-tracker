// Top-level build file. AGP 9.5.1 on Gradle 9.9.2: the Capacitor 8.6.2 template's AGP 8.13.0 and
// Gradle 8.14.3 cannot run on JDK 25 (Gradle runs on Java 25 from 9.1.0). AGP 9 compiles Kotlin
// itself (built-in Kotlin), so no Kotlin plugin is applied (docs/design/phase-5a-android.md).

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.5.1'
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

tasks.register('clean', Delete) {
    delete rootProject.layout.buildDirectory
}
